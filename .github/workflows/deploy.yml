name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint + test (runs on every push and PR) ─────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v --tb=short

  # ── Deploy (only on push to main, after tests pass) ─────────────────────
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== 무한맨틀 배포 시작 ==="

            cd ~/projects/muhanmantle-back
            git pull origin main

            source .venv/bin/activate
            pip install -r requirements.txt

            # Apply any pending DB migrations
            alembic upgrade head

            # Restart app (supervisor must be configured)
            sudo supervisorctl restart muhanmantle

            echo "=== 배포 완료 ==="
